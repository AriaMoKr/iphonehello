# Builds the apps on Windows, Linux and macOS and attaches them to a GitHub Release: a tag v<version>
# gets a release of its own (v1.2.0: "Hello World 1.2.0"), and a push to main that changes the apps
# the rolling prerelease latest. The files' names never change, so the latest release's have fixed
# addresses (README, "Download").
#
# hello.exe is the Win32 app. hello_qt-windows.zip holds the Qt app with the DLLs and Qt plugins it
# loads, hello_qt-linux.tar.gz needs Qt 6 from the distribution, and hello_qt-macos.zip holds
# hello_qt.app with Qt inside, signed ad hoc (not notarized).
name: Build

on:
  push:
    branches: [main]
    tags: ['v*'] # path filters don't apply to tags: every v tag builds
    paths:
      - '*.cpp'
      - 'Makefile'
      - 'CMakeLists.txt'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # The README's MSYS2 UCRT64 packages, and zip.
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            make
            zip
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-qt5-base

      - name: Build
        run: |
          make
          cmake -B build
          cmake --build build

      # A folder that runs without MSYS2: hello_qt.exe, the Qt plugins it loads, then every MSYS2 DLL
      # that the folder's files import, until each import is in the folder or in Windows.
      - name: Bundle hello_qt
        run: |
          app=hello_qt
          plugins=/ucrt64/share/qt5/plugins
          mkdir -p $app/platforms $app/styles
          cp build/hello_qt.exe $app/
          cp $plugins/platforms/qwindows.dll $app/platforms/
          cp $plugins/styles/qwindowsvistastyle.dll $app/styles/
          imports() {
            find $app -name '*.exe' -o -name '*.dll' | xargs objdump -p | awk '/DLL Name:/ { print $3 }' | sort -u
          }
          while :; do
            copied=
            for dll in $(imports); do
              if [ ! -e $app/$dll ] && [ -e /ucrt64/bin/$dll ]; then
                cp /ucrt64/bin/$dll $app/
                copied=1
              fi
            done
            [ -n "$copied" ] || break
          done
          sys=$(cygpath -S) # C:\Windows\System32
          for dll in $(imports); do
            case $dll in
              api-ms-win-*) continue ;; # API sets, names that Windows maps to its own DLLs
            esac
            if [ ! -e $app/$dll ] && [ ! -e $sys/$dll ]; then
              echo "::error::$dll is neither in $app nor in Windows"
              exit 1
            fi
          done
          ls $app
          zip -qr hello_qt-windows.zip $app

      - uses: actions/upload-artifact@v7
        with:
          path: hello.exe
          archive: false

      - uses: actions/upload-artifact@v7
        with:
          path: hello_qt-windows.zip
          archive: false

  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # The runner has the compiler and CMake.
      - run: sudo apt-get update && sudo apt-get install -y qt6-base-dev

      - name: Build
        run: |
          cmake -B build
          cmake --build build

      - name: Smoke test # still running after 5 seconds, drawing offscreen
        run: QT_QPA_PLATFORM=offscreen timeout 5 build/hello_qt || [ $? -eq 124 ]

      - run: tar -czf hello_qt-linux.tar.gz -C build hello_qt

      - uses: actions/upload-artifact@v7
        with:
          path: hello_qt-linux.tar.gz
          archive: false

  macos:
    # A fixed version, not macos-latest: the app needs the macOS it was built on or later (README).
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # The runner has Xcode's tools and CMake. Only qtbase (Core, Gui, Widgets and the like): with all of
      # qt, macdeployqt would also put other modules' plugins into the app.
      - run: brew install qtbase

      - name: Build
        run: |
          cmake -B build
          cmake --build build

      # Qt goes into the app, and the build's run paths into Homebrew come out, so the app never picks up a
      # Homebrew Qt on the Mac it runs on. Then it is signed ad hoc again: Apple silicon runs only signed code.
      - name: Bundle hello_qt.app
        run: |
          macdeployqt build/hello_qt.app
          exe=build/hello_qt.app/Contents/MacOS/hello_qt
          for rpath in $(otool -l $exe | awk '$2 == "LC_RPATH" { getline; getline; if ($2 !~ /^@/) print $2 }'); do
            install_name_tool -delete_rpath $rpath $exe
          done
          codesign --force --deep --sign - build/hello_qt.app

      # Still running after 5 seconds, and every library it loaded (dyld lists them) is in the app or macOS.
      - name: Smoke test
        run: |
          DYLD_PRINT_LIBRARIES=1 build/hello_qt.app/Contents/MacOS/hello_qt 2> loaded.txt &
          sleep 5
          kill $!
          grep '^dyld.*/Qt' loaded.txt
          grep '^dyld' loaded.txt | grep -Ev ' /(System|usr/lib)/|/hello_qt\.app/' > outside.txt || true
          if [ -s outside.txt ]; then
            cat outside.txt
            echo "::error::hello_qt.app loaded the files above from outside the app and macOS"
            exit 1
          fi

      - run: ditto -c -k --keepParent build/hello_qt.app hello_qt-macos.zip

      - uses: actions/upload-artifact@v7
        with:
          path: hello_qt-macos.zip
          archive: false

  release:
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
          skip-decompress: true

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          ls -l dist
          notes="Hello World in C++, built from $GITHUB_SHA. hello.exe is the Win32 app; hello_qt-windows.zip, hello_qt-linux.tar.gz and hello_qt-macos.zip hold the Qt app. The README says how to run them."
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
              gh release upload "$GITHUB_REF_NAME" dist/* --clobber
            else
              gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --title "Hello World ${GITHUB_REF_NAME#v}" --notes "$notes"
            fi
          else
            # latest moves to this commit: the release and its tag go, and come back here.
            gh release delete latest --cleanup-tag --yes > /dev/null 2>&1 || true
            gh release create latest dist/* --prerelease --target "$GITHUB_SHA" \
              --title "Hello World, latest from main" --notes "$notes"
          fi
