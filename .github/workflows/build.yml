# Builds the apps on Windows, Linux, macOS, iOS and Android and attaches them to a GitHub Release: a tag
# v<version> gets a release of its own (v1.2.0: "Hello World 1.2.0"), and a push to main that changes
# the apps the rolling prerelease latest. The files' names never change, so the latest release's have
# fixed addresses (README, "Download"). The apps carry the version of the newest tag at or before their
# commit, which the Makefile and CMakeLists.txt get from git describe, so each job checks out the whole
# history with its tags.
#
# hello.exe is the Win32 app. hello_qt-windows.zip holds the Qt app with the DLLs and Qt plugins it
# loads, hello_qt-linux.tar.gz needs Qt 6 from the distribution, and hello_qt-macos.zip holds
# hello_qt.app for Apple silicon and Intel with Qt inside, signed ad hoc (not notarized).
# hello_qt-ios.ipa is the Qt app for iPhones, unsigned, and hello_qt-ios-simulator.png shows it running
# in the iPhone Simulator. hello_qt-android.apk is the Qt app for Android, signed with a key made for the
# build, and hello_qt-android-emulator.png shows it in the Android emulator. The macOS, iPhone and
# Android apps get Qt from Qt's online repository (.github/qt.sh). The apps with Qt inside also get a
# folder licenses: the licenses of Qt and the other libraries in them, and where their source code is
# (.github/licenses.sh).
name: Build

on:
  push:
    branches: [main]
    tags: ['v*'] # path filters don't apply to tags: every v tag builds
    paths:
      - '*.cpp'
      - '*.rc'
      - 'Makefile'
      - 'CMakeLists.txt'
      - '.github/licenses.sh'
      - '.github/qt.sh'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: read

# The Qt of the macOS, iPhone and Android apps, 6.12.0, as Qt's online repository names it (.github/qt.sh)
env:
  QT: '6120'

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      # The README's MSYS2 UCRT64 packages (git for the version), zip, and jq for .github/licenses.sh.
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            make
            zip
            jq
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-git
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-qt6-base

      - name: Build
        run: |
          make
          cmake -B build
          cmake --build build

      # A folder that runs without MSYS2: hello_qt.exe, the Qt plugins it loads, then every MSYS2 DLL
      # that the folder's files import, until each import is in the folder or in Windows.
      - name: Bundle hello_qt
        run: |
          app=hello_qt
          plugins=/ucrt64/share/qt6/plugins
          mkdir -p $app/platforms $app/styles
          cp build/hello_qt.exe $app/
          cp $plugins/platforms/qwindows.dll $app/platforms/
          cp $plugins/styles/qmodernwindowsstyle.dll $app/styles/
          imports() {
            find $app -name '*.exe' -o -name '*.dll' | xargs objdump -p | awk '/DLL Name:/ { print $3 }' | sort -u
          }
          while :; do
            copied=
            for dll in $(imports); do
              if [ ! -e $app/$dll ] && [ -e /ucrt64/bin/$dll ]; then
                cp /ucrt64/bin/$dll $app/
                copied=1
              fi
            done
            [ -n "$copied" ] || break
          done
          sys=$(cygpath -S) # C:\Windows\System32
          for dll in $(imports); do
            case $dll in
              api-ms-win-*) continue ;; # API sets, names that Windows maps to its own DLLs
            esac
            if [ ! -e $app/$dll ] && [ ! -e $sys/$dll ]; then
              echo "::error::$dll is neither in $app nor in Windows"
              exit 1
            fi
          done
          ls $app

      # Still running after 5 seconds with only Windows' folders on PATH, and with its platform plugin
      # loaded from the folder (QT_DEBUG_PLUGINS lists the plugins Qt loads).
      - name: Smoke test
        run: |
          timeout 5 env PATH="$(cygpath -S):$(cygpath -W)" QT_DEBUG_PLUGINS=1 QT_FORCE_STDERR_LOGGING=1 \
            hello_qt/hello_qt.exe 2> plugins.txt || [ $? -eq 124 ]
          grep 'loaded library' plugins.txt | tee loaded.txt
          grep -q 'hello_qt/platforms/qwindows\.dll' loaded.txt

      # Into hello_qt/licenses: the licenses of Qt and the other DLLs, and where their source code is.
      - name: Licenses
        run: sh .github/licenses.sh windows hello_qt

      - run: zip -qr hello_qt-windows.zip hello_qt

      - uses: actions/upload-artifact@v7
        with:
          path: hello.exe
          archive: false

      - uses: actions/upload-artifact@v7
        with:
          path: hello_qt-windows.zip
          archive: false

  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      # The runner has the compiler and CMake.
      - run: sudo apt-get update && sudo apt-get install -y qt6-base-dev

      - name: Build
        run: |
          cmake -B build
          cmake --build build

      - name: Smoke test # still running after 5 seconds, drawing offscreen
        run: QT_QPA_PLATFORM=offscreen timeout 5 build/hello_qt || [ $? -eq 124 ]

      - run: tar -czf hello_qt-linux.tar.gz -C build hello_qt

      - uses: actions/upload-artifact@v7
        with:
          path: hello_qt-linux.tar.gz
          archive: false

  macos:
    # Qt 6.12 for macOS is built with Xcode 26, this runner's default Xcode. The app still runs on
    # macOS 14.4 or later, like Qt.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      # The runner has Xcode's tools and CMake. Qt for macOS, for Apple silicon and Intel in one, in the
      # folder Qt's installer gives it.
      - name: Install Qt
        run: |
          brew install sevenzip
          sh .github/qt.sh mac_x64/desktop/qt6_$QT/qt6_$QT qt.qt6.$QT.clang_64 qt/macos

      # For both architectures; Qt's toolchain file makes Qt's oldest macOS the app's too.
      - name: Build
        run: |
          cmake -B build -DCMAKE_TOOLCHAIN_FILE=$PWD/qt/macos/lib/cmake/Qt6/qt.toolchain.cmake \
            -DCMAKE_OSX_ARCHITECTURES='arm64;x86_64'
          cmake --build build

      # Qt goes into the app, and the build's run path into qt/macos comes out (otool lists it once for
      # each architecture), so the app looks for Qt only inside itself. The licenses of Qt go into
      # Contents/Resources/licenses. Then it is signed ad hoc again: Apple silicon runs only signed code.
      - name: Bundle hello_qt.app
        run: |
          qt/macos/bin/macdeployqt build/hello_qt.app
          exe=build/hello_qt.app/Contents/MacOS/hello_qt
          for rpath in $(otool -l $exe | awk '$2 == "LC_RPATH" { getline; getline; if ($2 !~ /^@/) print $2 }' | sort -u); do
            install_name_tool -delete_rpath $rpath $exe
          done
          sh .github/licenses.sh macos build/hello_qt.app qt/macos
          codesign --force --deep --sign - build/hello_qt.app

      # On Apple silicon, and the Intel half through Rosetta: still running after 10 seconds, and every
      # library it loaded (dyld lists them) is in the app or macOS. The macos-intel job starts the Intel half
      # on an Intel Mac too, but with macOS 15: here it runs with macOS 26. arch passes DYLD_PRINT_LIBRARIES
      # on (-e), which macOS would otherwise drop.
      - name: Smoke test
        run: |
          for arch in arm64 x86_64; do
            arch -$arch -e DYLD_PRINT_LIBRARIES=1 build/hello_qt.app/Contents/MacOS/hello_qt 2> loaded.txt &
            sleep 10
            kill $!
            grep -a '^dyld.*/Qt' loaded.txt
            # The paths in dyld's lines; its other lines ("move loaded to delayed: CacheDelete") have none.
            if grep -a '^dyld' loaded.txt | grep -o '/.*' | grep -Ev '^/(System|usr/lib)/|/hello_qt\.app/' > outside.txt; then
              sed "s/^/::error::Loaded from outside the app and macOS ($arch): /" outside.txt
              exit 1
            fi
          done

      - run: ditto -c -k --keepParent build/hello_qt.app hello_qt-macos.zip

      - uses: actions/upload-artifact@v7
        with:
          path: hello_qt-macos.zip
          archive: false

  macos-intel:
    # The macos job's app on an Intel Mac, which runs its Intel half natively. macOS 15 is the newest macOS
    # most Intel Macs get, and closer to the app's oldest, 14.4, than the macos job's 26.
    needs: macos
    runs-on: macos-15-intel
    steps:
      # The zip as the release has it (download-artifact would unzip it itself), unzipped by macOS's ditto.
      - uses: actions/download-artifact@v8
        with:
          name: hello_qt-macos.zip
          skip-decompress: true

      - run: ditto -x -k hello_qt-macos.zip .

      # Still running after 10 seconds, as Intel code, and every library it loaded (dyld lists them) is in
      # the app or macOS. vmmap names the code a process runs: X86-64 here, X86-64 (translated) through
      # Rosetta, ARM64 on Apple silicon. If the app quits, the end of its output becomes annotations:
      # dyld's messages, and Qt's, which without QT_FORCE_STDERR_LOGGING would go to macOS's log instead.
      - name: Smoke test
        run: |
          DYLD_PRINT_LIBRARIES=1 QT_FORCE_STDERR_LOGGING=1 hello_qt.app/Contents/MacOS/hello_qt 2> loaded.txt &
          sleep 10
          if ! kill -0 $!; then
            echo "::error::hello_qt quit within 10 seconds"
            tail -n 9 loaded.txt | sed 's/^/::error::/'
            exit 1
          fi
          code=$(vmmap -summary $! | sed -n 's/^Code Type: *//p')
          kill $!
          if [ "$code" != X86-64 ]; then
            echo "::error::vmmap's Code Type for hello_qt is '$code', not X86-64"
            exit 1
          fi
          echo "::notice::hello_qt ran as $code on $(sysctl -n machdep.cpu.brand_string), macOS $(sw_vers -productVersion)"
          grep -a '^dyld.*/Qt' loaded.txt
          # The paths in dyld's lines, as in the macos job.
          if grep -a '^dyld' loaded.txt | grep -o '/.*' | grep -Ev '^/(System|usr/lib)/|/hello_qt\.app/' > outside.txt; then
            sed 's/^/::error::Loaded from outside the app and macOS: /' outside.txt
            exit 1
          fi

  ios:
    # Qt 6.12 for iOS is built with Xcode 26, this runner's default Xcode.
    runs-on: macos-26
    defaults:
      run:
        shell: bash # -eo pipefail
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      # Qt three times: Qt for iOS built for iPhones and for the Simulator on Apple silicon, and Qt for
      # macOS, whose tools (moc and the like) the build runs, each in the folder Qt's installer gives it.
      - name: Install Qt
        run: |
          brew install sevenzip
          sh .github/qt.sh mac_x64/desktop/qt6_$QT/qt6_$QT qt.qt6.$QT.clang_64 qt/macos
          sh .github/qt.sh mac_x64/ios/qt6_$QT/qt6_${QT}_device qt.qt6.$QT.qtforios.device qt/ios_device
          sh .github/qt.sh mac_x64/ios/qt6_$QT/qt6_${QT}_simulator_arm64 qt.qt6.$QT.qtforios.simulator_arm64 \
            qt/ios_simulator_arm64

      # The iPhone app, unsigned (the README says how it gets signed), and the Simulator's. If the build fails,
      # its first errors become annotations: unlike the job's log, those can be read without a GitHub login.
      - name: Build
        run: |
          # <build folder> <Qt for iOS> <SDK>
          build() {
            cmake -B $1 -G Xcode -DCMAKE_TOOLCHAIN_FILE=$PWD/qt/$2/lib/cmake/Qt6/qt.toolchain.cmake \
              -DQT_HOST_PATH=$PWD/qt/macos -DCMAKE_OSX_SYSROOT=$3 &&
              cmake --build $1 --config Release -- -quiet CODE_SIGNING_ALLOWED=NO
          }
          if ! { build build-ios ios_device iphoneos && build build-simulator ios_simulator_arm64 iphonesimulator; } 2>&1 |
              tee build.txt; then
            grep -E -A 3 'error:|CMake Error' build.txt | head -n 10 | sed 's/^/::error::/'
            exit 1
          fi

      # The Simulator app in a simulated iPhone with the newest iOS here: still running after 10 seconds, and
      # a screenshot of it.
      - name: Smoke test
        run: |
          app=build-simulator/Release-iphonesimulator/hello_qt.app
          codesign --force --sign - $app # the Simulator on Apple silicon runs only signed code
          id=$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' $app/Info.plist)
          udid=$(xcrun simctl list -j devices available | jq -r '.devices | to_entries
            | map(select(.key | contains(".iOS-"))) | max_by(.key | [scan("[0-9]+") | tonumber]) | .value
            | map(select(.name | startswith("iPhone"))) | .[0].udid')
          xcrun simctl boot $udid
          xcrun simctl bootstatus $udid
          xcrun simctl install $udid $app
          pid=$(SIMCTL_CHILD_QT_FORCE_STDERR_LOGGING=1 xcrun simctl launch --stderr=$PWD/app.txt $udid $id |
            awk '{ print $NF }')
          sleep 10
          if ! kill -0 $pid; then
            echo "::error::hello_qt quit within 10 seconds"
            head -n 9 app.txt | sed 's/^/::error::/'
            exit 1
          fi
          xcrun simctl io $udid screenshot hello_qt-ios-simulator.png

      # The licenses of Qt, which the app has inside, go into hello_qt.app/licenses. An .ipa is a zip with
      # the app in Payload/.
      - name: Package hello_qt-ios.ipa
        run: |
          sh .github/licenses.sh ios build-ios/Release-iphoneos/hello_qt.app qt/ios_device
          mkdir Payload
          cp -R build-ios/Release-iphoneos/hello_qt.app Payload/
          zip -qr hello_qt-ios.ipa Payload

      - uses: actions/upload-artifact@v7
        with:
          path: hello_qt-ios.ipa
          archive: false

      - uses: actions/upload-artifact@v7
        with:
          path: hello_qt-ios-simulator.png
          archive: false

  android:
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash # -eo pipefail
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      # Qt for Android for 64-bit ARM, 32-bit ARM and x86-64, and Qt for Linux, whose tools (moc,
      # androiddeployqt and the like) the build runs, each in the folder Qt's installer gives it.
      - name: Install Qt
        run: |
          sudo apt-get update && sudo apt-get install -y libxml2-utils
          sh .github/qt.sh linux_x64/desktop/qt6_$QT/qt6_$QT qt.qt6.$QT.linux_gcc_64 qt/gcc_64
          for abi in arm64_v8a armv7 x86_64; do
            sh .github/qt.sh all_os/android/qt6_$QT/qt6_${QT}_$abi qt.qt6.$QT.android_$abi qt/android_$abi
          done

      # One APK for phones and tablets with 64-bit or 32-bit ARM and for x86-64 (Chromebooks, the
      # emulator), built for release and so unsigned. The runner has the Android SDK and NDK r27, CMake and
      # Ninja, and JDK 21, which Qt's Gradle build wants (from here on). If the build fails, its first errors
      # and its last lines become annotations.
      - name: Build
        run: |
          echo "JAVA_HOME=$JAVA_HOME_21_X64" >> $GITHUB_ENV
          export JAVA_HOME=$JAVA_HOME_21_X64
          if ! { cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
                   -DCMAKE_TOOLCHAIN_FILE=$PWD/qt/android_arm64_v8a/lib/cmake/Qt6/qt.toolchain.cmake \
                   -DQT_HOST_PATH=$PWD/qt/gcc_64 -DQT_ANDROID_ABIS='arm64-v8a;armeabi-v7a;x86_64' \
                   -DQT_PATH_ANDROID_ABI_armeabi-v7a=$PWD/qt/android_armv7 \
                   -DQT_PATH_ANDROID_ABI_x86_64=$PWD/qt/android_x86_64 &&
                 cmake --build build --target apk; } 2>&1 | tee build.txt; then
            grep -E -A 3 --no-group-separator 'error:|CMake Error|FAILED:|What went wrong' build.txt |
              head -n 8 | sed 's/^/::error::/'
            tail -n 40 build.txt | tr -d '\r' | sed 's/%/%25/g' |
              awk '{ s = s $0 "%0A" } END { print "::warning title=End of the build log::" s }'
            exit 1
          fi

      # The licenses of everything in the APK go into it (assets/licenses). Then it is aligned and signed, as
      # Android installs only signed apps: with a key made for this build, like Android's debug keys.
      - name: Package hello_qt-android.apk
        run: |
          tools=$ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools | sort -V | tail -n 1)
          cp build/android-build/hello_qt.apk unsigned.apk
          sh .github/licenses.sh android unsigned.apk build/android-build qt/android_arm64_v8a
          $tools/zipalign -P 16 -f 4 unsigned.apk aligned.apk
          keytool -genkeypair -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 -dname 'CN=Android Debug,O=Android,C=US'
          $tools/apksigner sign --ks debug.keystore --ks-pass pass:android --out hello_qt-android.apk aligned.apk
          $tools/apksigner verify --print-certs hello_qt-android.apk

      # In the Android emulator, with Android 16 (KVM makes it fast): still running after 10 seconds, and a
      # screenshot of it.
      - name: Smoke test
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' |
            sudo tee /etc/udev/rules.d/99-kvm.rules > /dev/null
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          bin=$ANDROID_HOME/cmdline-tools/latest/bin
          adb=$ANDROID_HOME/platform-tools/adb
          image='system-images;android-36;default;x86_64'
          { yes || :; } | $bin/sdkmanager --install emulator "$image" > /dev/null
          # avdmanager follows XDG_CONFIG_HOME, which the runner sets, but the emulator doesn't, so without
          # ANDROID_AVD_HOME they look for the AVD in different folders.
          export ANDROID_AVD_HOME=$HOME/.android/avd
          mkdir -p $ANDROID_AVD_HOME
          echo no | $bin/avdmanager create avd -n hello -k "$image" -d pixel_6 > /dev/null
          $ANDROID_HOME/emulator/emulator -avd hello -no-window -no-audio -no-boot-anim -no-snapshot \
            -gpu swiftshader_indirect > emulator.txt 2>&1 &
          timeout 300 $adb wait-for-device
          for i in $(seq 60); do
            [ "$($adb shell getprop sys.boot_completed | tr -d '\r')" = 1 ] && break
            sleep 5
          done
          if [ "$($adb shell getprop sys.boot_completed | tr -d '\r')" != 1 ]; then
            echo "::error::The emulator didn't finish starting"
            tail -n 9 emulator.txt | sed 's/^/::error::/'
            exit 1
          fi
          $adb shell wm dismiss-keyguard || :
          id=io.github.ariamokr.iphonehello
          if ! { $adb install hello_qt-android.apk &&
                 $adb shell monkey -p $id -c android.intent.category.LAUNCHER 1; } > start.txt 2>&1; then
            sed 's/^/::error::/' start.txt | tail -n 5
            exit 1
          fi
          sleep 10
          if ! $adb shell pidof $id > /dev/null; then
            echo "::error::hello_qt quit within 10 seconds"
            $adb logcat -d | grep -i -E 'hello_qt|qt|AndroidRuntime' | tail -n 9 | sed 's/^/::error::/'
            exit 1
          fi
          $adb exec-out screencap -p > hello_qt-android-emulator.png

      - uses: actions/upload-artifact@v7
        with:
          path: hello_qt-android.apk
          archive: false

      - uses: actions/upload-artifact@v7
        with:
          path: hello_qt-android-emulator.png
          archive: false

  release:
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux, macos, macos-intel, ios, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
          skip-decompress: true

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          ls -l dist
          notes="Hello World in C++, built from $GITHUB_SHA. hello.exe is the Win32 app; hello_qt-windows.zip, hello_qt-linux.tar.gz and hello_qt-macos.zip hold the Qt app, hello_qt-ios.ipa is the Qt app for iPhones, unsigned (hello_qt-ios-simulator.png shows it in the iPhone Simulator), and hello_qt-android.apk the Qt app for Android, signed with a key made for this build (hello_qt-android-emulator.png shows it in the Android emulator). The README says how to run them. The Windows, macOS, iPhone and Android apps have Qt inside, and the Windows and Android ones other libraries too: their licenses, and where their source code is, are in the folder licenses in each."
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
              gh release upload "$GITHUB_REF_NAME" dist/* --clobber
            else
              gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --title "Hello World ${GITHUB_REF_NAME#v}" --notes "$notes"
            fi
          else
            # latest moves to this commit: the release and its tag go, and come back here.
            gh release delete latest --cleanup-tag --yes > /dev/null 2>&1 || true
            gh release create latest dist/* --prerelease --target "$GITHUB_SHA" \
              --title "Hello World, latest from main" --notes "$notes"
          fi
